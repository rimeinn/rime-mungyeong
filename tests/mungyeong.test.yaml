schema: mungyeong
source_dir: ..

script: |
  function eq(actual, expected)
    print("actual=" .. tostring(actual) .. " expected=" .. tostring(expected))
    return actual == expected
  end

deploy:
  default:
    tests:
      # 1. 基本的辅音和元音输入
      - send: r
        assert: preedit == "ㄱ"
      - send: k
        assert: preedit == "ㅏ"
      - send: d
        assert: preedit == "ㅇ"

      # 2. 紧音（双辅音）输入
      - send: R
        assert: preedit == "ㄲ"
      - send: W
        assert: preedit == "ㅉ"
      - send: T
        assert: preedit == "ㅆ"

      # 3. 简单的音节合成 (CV - Consonant + Vowel)
      - send: rk
        assert: preedit == "가"  # ㄱ + ㅏ
      - send: sk
        assert: preedit == "나"  # ㄴ + ㅏ
      - send: dk
        assert: preedit == "아"  # ㅇ + ㅏ

      # 4. 合成带末尾辅音（收音）的音节
      - send: rkr
        assert: preedit == "각"  # 가 + ㄱ
      - send: gks
        assert: preedit == "한"  # ㅎ + ㅏ + ㄴ
      - send: qkd
        assert: preedit == "방"  # ㅂ + ㅏ + ㅇ

      # 5. 合成带双末尾辅音（收音）的音节
      - send: ekfr
        assert: preedit == "닭"  # ㄷ + ㅏ + ㄺ (ㄹ+ㄱ)
      - send: djqt
        assert: preedit == "없"  # ㅇ + ㅓ + ㅄ (ㅂ+ㅅ)
      - send: rkrt
        assert: preedit == "갃"  # ㄱ + ㅏ +  ㄳ(ㄱ+ㅅ)

      # 6. 音节的自动组合与分离
      - send: gksr
        assert: preedit == "한ㄱ" # 应该显示 "한" 加上一个
      - send: gksrnr
        assert: preedit == "한국" # ㅎ+ㅏ+ㄴ, ㄱ+ㅜ+ㄱ
      - send: "rk rk"
        assert: commit == "가 " and preedit == "가"
      
      # 7. 退格键 (BackSpace) 测试
      - send: gksrnr{BackSpace}
        assert: preedit == "한구" # 从 "한국" 删除末尾的 "ㄱ"
      - send: gksrnr{BackSpace}{BackSpace}{BackSpace}
        assert: preedit == "한"   # 从 "한국" 删除 "ㄱ"  "ㅜ"  "ㄱ"
      - send: gks{BackSpace}
        assert: preedit == "하"   # 从 "한" (ㅎ+ㅏ+ㄴ) 删除 "ㄴ"
      - send: gks{BackSpace}{BackSpace}
        assert: preedit == "ㅎ"   # 从 "한" 删除 "ㄴ" 和 "ㅏ"
      - send: r{BackSpace}
        assert: preedit == nil      # 删除单个辅音
      - send: gksrnr{BackSpace}r
        assert: preedit == "한국" # ㅎ+ㅏ+ㄴ, ㄱ+ㅜ, delete ㄱ, re-type ㄱ -> ㅎ+ㅏ+ㄴ, ㄱ+ㅜ+ㄱ
      - send: gks{BackSpace}s
        assert: preedit == "한" # ㅎ+ㅏ, delete ㄴ, re-type ㄴ -> ㅎ+ㅏ+ㄴ
      - send: ekfr{BackSpace}a
        assert: preedit == "닮"  # ㄷ+ㅏ+ㄹ+ㄱ, delete ㄱ, re-type ㅁ -> ㄷ+ㅏ+ㄹ+ㅁ

      # 8. 提交字符 (Commit) 测试
      - send: "gksrnr "
        assert: commit == "한국 "

      # 9. 光标移动后输入
      - send: gksrnr{Left}k
        assert: preedit == "하나국" # 在 "한국" 中间插入元音 "ㅏ", "ㄴ"与"ㅏ"重组成"나"
      - send: ekfrrhrl{Left}{Left}p
        assert: preedit == "달게고기" # 在 "닭고기" 中间插入元音 "ㅔ", "ㄺ"拆开重组成"달게"
      - send: gksrnr{Left}t
        assert: preedit == "한ㅅ국" # 在 "한국" 中间插入辅音 "ㅅ", 无法重组, 直接插入
  

      # BackSpace regressions: compound vowels and editing after deletion
      - send: ekfr{BackSpace}
        assert: eq(preedit, "달")
      - send: rhk
        assert: eq(preedit, "과")
      - send: rhk{BackSpace}
        assert: eq(preedit, "고")
      - send: rhk{BackSpace}l
        assert: eq(preedit, "괴")
      - send: hk{BackSpace}
        assert: eq(preedit, "ㅗ")
      - send: rnp{BackSpace}
        assert: eq(preedit, "구")
      - send: rhl{BackSpace}
        assert: eq(preedit, "고")
      - send: rml{BackSpace}
        assert: eq(preedit, "그")
      - send: R{BackSpace}
        assert: eq(preedit, nil)
      - send: rkR{BackSpace}
        assert: eq(preedit, "가")
      - send: gksrnr{Left}{BackSpace}
        assert: eq(preedit, "하국")
      - send: gksrnr{Home}{BackSpace}
        assert: eq(preedit, "한국")
      - send: gksrnr{Home}{Delete}
        assert: eq(preedit, "국")
      - send: rhk{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rhk{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rhks{BackSpace}
        assert: eq(preedit, "과")
      - send: rho
        assert: eq(preedit, "괘")
      - send: rho{BackSpace}
        assert: eq(preedit, "고")
      - send: rho{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rho{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rhos{BackSpace}
        assert: eq(preedit, "괘")
      - send: rhl
        assert: eq(preedit, "괴")
      - send: rhl{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rhl{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rhls{BackSpace}
        assert: eq(preedit, "괴")
      - send: rnj
        assert: eq(preedit, "궈")
      - send: rnj{BackSpace}
        assert: eq(preedit, "구")
      - send: rnj{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rnj{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rnjs{BackSpace}
        assert: eq(preedit, "궈")
      - send: rnp
        assert: eq(preedit, "궤")
      - send: rnp{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rnp{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rnps{BackSpace}
        assert: eq(preedit, "궤")
      - send: rnl
        assert: eq(preedit, "귀")
      - send: rnl{BackSpace}
        assert: eq(preedit, "구")
      - send: rnl{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rnl{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rnls{BackSpace}
        assert: eq(preedit, "귀")
      - send: rml
        assert: eq(preedit, "긔")
      - send: rml{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rml{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rmls{BackSpace}
        assert: eq(preedit, "긔")
      - send: hk{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: rhk{BackSpace}k
        assert: eq(preedit, "과")
      - send: rhk{BackSpace}s
        assert: eq(preedit, "곤")
      - send: rhkrk{Left}{BackSpace}
        assert: eq(preedit, "고가")
      - send: rhkrk{Left}{BackSpace}l
        assert: eq(preedit, "괴가")
      - send: ro{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: rO{BackSpace}
        assert: eq(preedit, "ㄱ")

  romaja:
    patch:
      mungyeong/layout: "romaja"
    tests:
      # 1. 基本的辅音和元音输入
      - send: g
        assert: preedit == "ㄱ"
      - send: a
        assert: preedit == "ㅏ"
      - send: x
        assert: preedit == "ㅇ"   # 'x' for initial 'ㅇ'
      # 2. 紧音（双辅音）输入
      - send: G # Shift + g
        assert: preedit == "ㄲ"
      - send: J # Shift + j
        assert: preedit == "ㅉ"
      - send: S # Shift + s
        assert: preedit == "ㅆ"
      # 3. 简单的音节合成 (CV - Consonant + Vowel)
      - send: ga
        assert: preedit == "가"  # g + a
      - send: na
        assert: preedit == "나"  # n + a
      - send: xa
        assert: preedit == "아"  # x(ㅇ) + a
      # 4. 合成带末尾辅音（收音）的音节
      - send: gag
        assert: preedit == "각"  # g + a + g
      - send: han
        assert: preedit == "한"  # h + a + n
      - send: bang
        assert: preedit == "방"  # b + a + ng(ㅇ)
      # 5. 合成带双末尾辅音（收音）的音节
      - send: dalg
        assert: preedit == "닭"  # d + a + l + g
      - send: xeobs
        assert: preedit == "없"  # x(ㅇ) + eo + b + s
      - send: gags
        assert: preedit == "갃"  # g + a + g + s
      # 6. 音节的自动组合与分离
      - send: hang
        assert: preedit == "항" 
      - send: hangug
        assert: preedit == "한국" # h+a+n, g+u+g
      - send: "ga ga"
        assert: commit == "가 " and preedit == "가"
      
      # 7. 退格键 (BackSpace) 测试
      - send: hangug{BackSpace}
        assert: preedit == "한구" # 从 "한국" 删除末尾的 "g"
      - send: hangug{BackSpace}{BackSpace}{BackSpace}
        assert: preedit == "한"   # 从 "한국" 删除 "g", "u", "g"
      - send: han{BackSpace}
        assert: preedit == "하"   # 从 "한" (h+a+n) 删除 "n"
      - send: han{BackSpace}{BackSpace}
        assert: preedit == "ㅎ"   # 从 "한" 删除 "n" 和 "a"
      - send: g{BackSpace}
        assert: preedit == nil      # 删除单个辅音
      - send: hangug{BackSpace}g
        assert: preedit == "한국" # 测试删除后重输: 한구 -> 한국
      - send: han{BackSpace}n
        assert: preedit == "한"   # 测试删除后重输: 하 -> 한
      - send: dalg{BackSpace}m
        assert: preedit == "닮"  # 测试双收音变化: 닭 -> 달 -> 닮
      # 8. 提交字符 (Commit) 测试
      - send: "hangug "
        assert: commit == "한국 "
      # 9. 光标移动后输入
      - send: hangug{Left}a
        assert: preedit == "하나국" # 在 "한국" 中间插入元音 "ㅏ", "ㄴ"与"ㅏ"重组成"나"
      - send: dalggogi{Left}{Left}e
        assert: preedit == "달게고기" # 在 "닭고기" 中间插入元音 "ㅔ", "ㄺ"拆开重组成"달게"
      - send: hangug{Left}s
        assert: preedit == "한ㅅ국" # 在 "한국" 中间插入辅音 "ㅅ", 无法重组, 直接插入

      # Compound-vowel deletion follows Hangul components in every layout.
      - send: gwa
        assert: eq(preedit, "과")
      - send: gwa{BackSpace}
        assert: eq(preedit, "고")
      - send: gwa{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: gwa{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: gwan{BackSpace}
        assert: eq(preedit, "과")
      - send: gwae
        assert: eq(preedit, "괘")
      - send: gwae{BackSpace}
        assert: eq(preedit, "고")
      - send: gwae{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: gwae{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: gwaen{BackSpace}
        assert: eq(preedit, "괘")
      - send: goe
        assert: eq(preedit, "괴")
      - send: goe{BackSpace}
        assert: eq(preedit, "고")
      - send: goe{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: goe{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: goen{BackSpace}
        assert: eq(preedit, "괴")
      - send: gwo
        assert: eq(preedit, "궈")
      - send: gwo{BackSpace}
        assert: eq(preedit, "구")
      - send: gwo{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: gwo{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: gwon{BackSpace}
        assert: eq(preedit, "궈")
      - send: gwe
        assert: eq(preedit, "궤")
      - send: gwe{BackSpace}
        assert: eq(preedit, "구")
      - send: gwe{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: gwe{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: gwen{BackSpace}
        assert: eq(preedit, "궤")
      - send: gwi
        assert: eq(preedit, "귀")
      - send: gwi{BackSpace}
        assert: eq(preedit, "구")
      - send: gwi{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: gwi{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: gwin{BackSpace}
        assert: eq(preedit, "귀")
      - send: gui
        assert: eq(preedit, "긔")
      - send: gui{BackSpace}
        assert: eq(preedit, "그")
      - send: gui{BackSpace}{BackSpace}
        assert: eq(preedit, "ㄱ")
      - send: gui{BackSpace}{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: guin{BackSpace}
        assert: eq(preedit, "긔")
      - send: gwa{BackSpace}e
        assert: eq(preedit, "괴")
      - send: gwo{BackSpace}i
        assert: eq(preedit, "긔")
      - send: wa{BackSpace}
        assert: eq(preedit, "ㅗ")
      - send: wa{BackSpace}{BackSpace}
        assert: eq(preedit, nil)
      - send: gwaga{Left}{BackSpace}
        assert: eq(preedit, "고가")
      - send: gwaga{Left}{BackSpace}e
        assert: eq(preedit, "괴가")

  # Space commits Hangul even when Hanja candidates are available.
  space_hangul:
    options:
      candidates: true
    tests:
    - send: skql{space}
      assert: eq(commit, "나비 ") and preedit == nil
    - send: gksrnr{space}
      assert: eq(commit, "한국 ") and preedit == nil
    - send: r{space}
      assert: eq(commit, "ㄱ ") and preedit == nil
    - send: rhk{space}
      assert: eq(commit, "과 ") and preedit == nil
    - send: skql{Left}{Right}{space}
      assert: eq(commit, "나비 ") and preedit == nil
    - send: skql{BackSpace}{space}
      assert: eq(commit, "나ㅂ ") and preedit == nil
    - send: skql{space}r
      assert: eq(commit, "나비 ") and eq(preedit, "ㄱ")
  space_hangul_no_candidates:
    options:
      candidates: false
    tests:
    - send: skql{space}
      assert: eq(commit, "나비 ") and preedit == nil
    - send: gksrnr{space}
      assert: eq(commit, "한국 ") and preedit == nil
    - send: r{space}
      assert: eq(commit, "ㄱ ") and preedit == nil
    - send: rhk{space}
      assert: eq(commit, "과 ") and preedit == nil
    - send: skql{Left}{Right}{space}
      assert: eq(commit, "나비 ") and preedit == nil
    - send: skql{BackSpace}{space}
      assert: eq(commit, "나ㅂ ") and preedit == nil
    - send: skql{space}r
      assert: eq(commit, "나비 ") and eq(preedit, "ㄱ")
